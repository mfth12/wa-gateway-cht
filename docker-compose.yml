version: '3.8'

services:
  wa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-gateway-cht
    restart: unless-stopped
    ports:
      - "${PORT:-3033}:3033"
    environment:
      - NODE_ENV=production
      - PORT=3033
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-root}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-123123}
      - API_KEY=${API_KEY:-}
    volumes:
      # Persist WhatsApp sessions
      # - wa-gateway_sessions:/app/sessions
      - ./.wa_data/sessions:/app/sessions

      # Persist received media files
      # - wa-gateway_media:/app/public/media
      - ./.wa_data/media:/app/public/media

      # Persist message store
      # - wa-gateway_store:/app/store
      - ./.wa_data/store:/app/store
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3033/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - wa-gateway-network

# volumes:
#   wa-gateway_sessions:
#     driver: local
#   wa-gateway_media:
#     driver: local
#   wa-gateway_store:
#     driver: local

networks:
  wa-gateway-network:
    driver: bridge
